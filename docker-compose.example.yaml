services:
  liveguard:
    build: .
    restart: unless-stopped
    environment:
      HA_TOKEN: ${HA_TOKEN}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      - ./config:/config        # liveguard.yaml
      - ./data:/data            # feedback history, TTS cache
      - ./models:/models        # Piper voice .onnx + .onnx.json
    ports:
      - "8099:8099"             # go2rtc fetches spoken audio from here
